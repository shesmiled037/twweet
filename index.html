<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contoh Video Player Card</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background-color: #f5f5f5;
    text-align: center;
}
h1 {
    margin-bottom: 40px;
}
video {
    display: block;
    margin: 0 auto;
    max-width: 100%;
}
</style>

<!-- Twitter Player Card -->
<meta name="twitter:card" content="player">
<meta name="twitter:site" content="@akunTwitterLo"> <!-- ganti dengan akun Twitter lo -->
<meta name="twitter:title" content="Judul Video Contoh">
<meta name="twitter:description" content="Deskripsi video contoh">
<meta name="twitter:image" content="https://lampung7news.co.id/go/thumb.jpg"> <!-- ganti thumbnail jika ada -->
<meta name="twitter:player" content="https://lampung7news.co.id/go/cewe.mp4">
<meta name="twitter:player:width" content="640">
<meta name="twitter:player:height" content="360">
<meta name="twitter:player:stream" content="https://lampung7news.co.id/go/cewe.mp4">

</head>
<body>

<h1>Contoh Video Player Card</h1>

<!-- Pemutar video di halaman -->
<video controls>
    <source src="https://lampung7news.co.id/go/cewe.mp4" type="video/mp4">
    Browser Anda tidak mendukung tag video.
</video>

</body>
</html>
