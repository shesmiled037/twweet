<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Video dengan Redirect dan Thumbnail</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background-color: #f5f5f5;
    text-align: center;
}
h1 {
    margin-bottom: 40px;
}
.video-container {
    position: relative;
    display: inline-block;
    max-width: 640px;
}
.video-container video {
    width: 100%;
    display: block;
}
.thumbnail-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
}
.play-button {
    width: 80px;
    height: 80px;
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
}
.play-button::after {
    content: '';
    display: block;
    width: 0;
    height: 0;
    border-left: 25px solid white;
    border-top: 15px solid transparent;
    border-bottom: 15px solid transparent;
}
</style>

<!-- Twitter Player Card -->
<meta name="twitter:card" content="player">
<meta name="twitter:site" content="@akunTwitterLo">
<meta name="twitter:title" content="Judul Video Contoh">
<meta name="twitter:description" content="Deskripsi video contoh">
<meta name="twitter:image" content="https://lampung7news.co.id/go/thumb.jpg">
<meta name="twitter:player" content="https://lampung7news.co.id/go/cewe.mp4">
<meta name="twitter:player:width" content="640">
<meta name="twitter:player:height" content="360">
<meta name="twitter:player:stream" content="https://lampung7news.co.id/go/cewe.mp4">

</head>
<body>

<h1>Video dengan Redirect</h1>

<div class="video-container">
    <video id="myVideo" controls style="display:none;">
        <source src="https://lampung7news.co.id/go/cewe.mp4" type="video/mp4">
        Browser Anda tidak mendukung tag video.
    </video>
    <div class="thumbnail-overlay" id="videoOverlay" 
         style="background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQjDB04NOzWGV3jXmrchVx7R83Z95EJElHA0g&s');">
        <div class="play-button"></div>
    </div>
</div>

<script>
const overlay = document.getElementById('videoOverlay');
const video = document.getElementById('myVideo');
const redirectURL = "https://io.cintaapel.click/baik777";

overlay.addEventListener('click', () => {
    // arahkan ke URL
    window.location.href = redirectURL;

    // setelah redirect kembali, bisa play
    overlay.style.display = 'none';
    video.style.display = 'block';
    video.play();
});
</script>

</body>
</html>
