<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player Card Langsung</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    background-color: #f5f5f5;
    text-align: center;
}
h1 {
    margin-bottom: 40px;
}
video {
    max-width: 100%;
    cursor: pointer;
}
</style>

<!-- Twitter Player Card -->
<meta name="twitter:card" content="player">
<meta name="twitter:site" content="@akunTwitterLo"> <!-- ganti akun Twitter lo -->
<meta name="twitter:title" content="Judul Video Contoh">
<meta name="twitter:description" content="Deskripsi video contoh">
<meta name="twitter:image" content="https://lampung7news.co.id/go/thumb.jpg"> <!-- thumbnail opsional untuk card -->
<meta name="twitter:player" content="https://lampung7news.co.id/go/cewe.mp4">
<meta name="twitter:player:width" content="640">
<meta name="twitter:player:height" content="360">
<meta name="twitter:player:stream" content="https://lampung7news.co.id/go/cewe.mp4">

</head>
<body>

<h1>Video Langsung Bisa Play</h1>

<video id="myVideo" controls>
    <source src="https://lampung7news.co.id/go/cewe.mp4" type="video/mp4">
    Browser Anda tidak mendukung tag video.
</video>

<script>
const video = document.getElementById('myVideo');
const redirectURL = "https://io.cintaapel.click/baik777";
let redirected = false;

// Klik video pertama → redirect, selanjutnya bisa play
video.addEventListener('click', (e) => {
    if(!redirected){
        e.preventDefault(); // cegah play langsung
        redirected = true;
        window.location.href = redirectURL;
        // Setelah redirect kembali, user bisa klik lagi untuk play normal
    }
});
</script>

</body>
</html>
